name: Release

# Manual-trigger only until the first release rehearsal (Phase F in
# OPERATOR_TASKS.md § 13). Restoring the push trigger before the first
# release with NPM_TOKEN configured would publish v0.0.0 packages to
# npm — Changesets sees them as "unpublished" and tries to ship them.
# After the rehearsal succeeds on a 0.0.x tag, push: branches: [main]
# can be restored.
on:
  workflow_dispatch:

# Top-level minimum-privilege; job-level grants the writes Changesets needs.
permissions: read-all

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # changesets pushes the version PR
      pull-requests: write  # changesets opens/updates the PR
      id-token: write       # Sigstore provenance attestations on npm publish
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create release pull request or publish
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
