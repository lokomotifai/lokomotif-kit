name: Feature request
description: Propose a new capability for Lokomotif Kit.
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Schema, scope, or convention changes go through the [RFC process](../../GOVERNANCE.md), not feature requests.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What practitioner or contributor pain does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: rtcsg
    attributes:
      label: Affected RTCSG layer (if any)
      multiple: true
      options:
        - Role
        - Task & Format
        - Context & Constraint
        - Style & Tone
        - Guardrail
        - 'N/A — tooling'
