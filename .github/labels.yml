# Lokomotif Kit — issue and PR label taxonomy.
# Synced to GitHub by .github/workflows/labels.yml on push to main.
# Adding/renaming labels here propagates to the repo automatically.

# ---------- Type ----------

- name: bug
  color: 'd73a4a'
  description: 'Something does not work as documented.'
- name: enhancement
  color: 'a2eeef'
  description: 'New feature or improvement.'
- name: rfc
  color: '7057ff'
  description: 'Request for Comments — durable decision needed.'
- name: discussion
  color: 'cfd3d7'
  description: 'Open conversation; convert to issue when actionable.'
- name: question
  color: 'd876e3'
  description: 'Question that may not require code changes.'
- name: triage
  color: 'fbca04'
  description: 'Awaiting maintainer review.'

# ---------- Area (which package or surface) ----------

- name: 'area/schema'
  color: '0e8a16'
  description: 'JSON Schema or contract change.'
- name: 'area/cli'
  color: '0e8a16'
  description: '@lokomotif/cli'
- name: 'area/sdk'
  color: '0e8a16'
  description: '@lokomotif/sdk'
- name: 'area/eval'
  color: '0e8a16'
  description: 'Python eval harness in packages/eval.'
- name: 'area/otel-schema'
  color: '0e8a16'
  description: '@lokomotif/otel-schema'
- name: 'area/blueprints'
  color: '0e8a16'
  description: 'Runtime blueprints under blueprints/.'
- name: 'area/docs'
  color: '0e8a16'
  description: 'Documentation site (kit.lokomotif.ai).'
- name: 'area/modules'
  color: '0e8a16'
  description: 'Canonical RTCSG modules under modules/.'
- name: 'area/build'
  color: '0e8a16'
  description: 'Build, CI, tooling, repo policy.'

