# ---------- Status ----------

- name: 'status/blocked'
  color: 'e99695'
  description: 'Cannot progress until something else lands.'
- name: 'status/in-progress'
  color: 'fbca04'
  description: 'A maintainer or contributor is actively working on this.'
- name: 'status/needs-info'
  color: 'd4c5f9'
  description: 'Awaiting clarification from the reporter.'
- name: 'status/wontfix'
  color: 'ffffff'
  description: 'Not in scope for the Kit.'
