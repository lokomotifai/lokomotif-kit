# Lokomotif Kit — yamllint configuration.
# Applied via pre-commit and locally with: yamllint -c .yamllint.yaml .

extends: default

rules:
  line-length:
    max: 120
    level: warning
  truthy:
    check-keys: false
  document-start:
    present: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  braces:
    max-spaces-inside: 1
  indentation:
    spaces: 2
    indent-sequences: consistent

ignore: |
  pnpm-lock.yaml
  .changeset/
  node_modules/
  .turbo/
  packages/eval/.venv/
  packages/eval/uv.lock
