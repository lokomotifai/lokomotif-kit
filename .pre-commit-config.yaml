# Lokomotif Kit pre-commit configuration.
# Install hooks: pre-commit install
# Run on all files: pre-commit run --all-files
#
# default_install_hook_types pulls in commit-msg too so a single
# `pre-commit install` wires both stages.

default_language_version:
  python: python3

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: "^LICENSE$"
      - id: end-of-file-fixer
        exclude: "^LICENSE$"
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-toml
      - id: check-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        files: "^packages/eval/"
        args: ["--fix"]
      - id: ruff-format
        files: "^packages/eval/"

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yaml"]
        exclude: '^(pnpm-lock\.yaml|\.changeset/)'

  # Prettier runs against staged files via the project's local install so
  # the formatter version always matches what CI's `pnpm format:check` uses.
  # `--ignore-unknown` lets prettier skip files it doesn't know how to
  # format and respect `.prettierignore`.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: pnpm exec prettier --write --ignore-unknown
        stages: [pre-commit]
        pass_filenames: true

  # PII detection.
  # Operator activation lives in OPERATOR_TASKS.md § 10. Once `uv sync`
  # has been run inside packages/eval the hook can be re-enabled below.

  # Conventional Commits — runs on commit-msg via the pre-commit
  # framework's commit-msg stage. commitlint is invoked through pnpm
  # so the workspace's pinned version is used.
  - repo: local
    hooks:
      - id: commitlint
        name: Conventional Commits
        language: system
        entry: pnpm exec commitlint --edit
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
